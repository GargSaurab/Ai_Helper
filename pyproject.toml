[project]
name = "codinghelperai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.1.3",
    "fastapi[standard]>=0.136.0",
    "google-genai>=1.69.0",
    "langchain>=1.2.14",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.1",
    "openai>=2.30.0",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.38",
]
[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
